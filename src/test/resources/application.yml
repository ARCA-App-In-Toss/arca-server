spring:
  application:
    name: arca-server

  datasource:
    url: jdbc:h2:mem:arca;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    locations:
      - classpath:database/migration
      - classpath:database/seed

cors:
  allowed-origins:
    - https://miniapp.arca.test
