spring:
  application:
    name: arca-server

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    locations:
      - classpath:database/migration
      - classpath:database/seed

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

auth-session:
  ttl: 24h

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    correlation: "[%X{requestId}] "
